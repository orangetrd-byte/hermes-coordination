<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0b0d10" />
<title>Hermes Coordination Channel</title>
<style>
  :root{
    --bg:#0b0d10; --bg2:#0f1216; --panel:#13161b; --ink:#e6e8eb; --muted:#8a919d; --dim:#5a6270;
    --line:#1f242c; --line2:#2a3140; --accent:#60a5fa; --accent2:#3b82f6;
    --open:#f59e0b; --done:#10b981; --yield:#ef4444; --assign:#fbbf24; --infer:#c4b5fd; --chat:#93c5fd;
    --shadow:0 4px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body,#app{height:100%;height:100dvh}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior-y:none}
  #app{display:flex;flex-direction:column;overflow:hidden}

  /* Login */
  #login-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% -20%,#1c2a3d,var(--bg) 70%);z-index:10;transition:opacity .35s ease,visibility .35s}
  #login-wrap.hidden{opacity:0;visibility:hidden;pointer-events:none}
  #login-card{background:var(--panel);border:1px solid var(--line);padding:22px 20px;border-radius:18px;display:flex;flex-direction:column;gap:14px;width:min(340px,100%);box-shadow:var(--shadow)}
  .login-title{font-weight:700;font-size:17px;letter-spacing:-.2px;margin:0}
  #pin{background:#0e1116;border:1px solid var(--line);color:var(--ink);padding:13px 14px;border-radius:13px;font:inherit;font-size:15px;letter-spacing:.5px;transition:border-color .2s}
  #pin:focus{border-color:var(--accent);outline:none}
  #connect-btn{background:linear-gradient(180deg,#1f3a5f,#1a2f4f);border:1px solid #3b82f6;color:#dbeafe;padding:12px;border-radius:13px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .1s,opacity .2s}
  #connect-btn:active{transform:scale(.97);opacity:.8}
  #login-msg{color:var(--muted);font-size:12px;min-height:18px;text-align:center;min-height:20px}

  /* Header */
  header{flex:none;padding:12px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(140%) blur(14px);position:relative;z-index:2}
  #title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  #title{font-weight:700;font-size:15px;letter-spacing:-.1px;margin:0;display:flex;align-items:center;gap:8px}
  #title::before{content:'';width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#93c5fd,#2563eb);box-shadow:0 0 12px color-mix(in srgb,#3b82f6 40%,transparent);display:inline-block}
  #status{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background .3s,box-shadow .3s;flex-shrink:0}
  #status.on{background:#22c55e;box-shadow:0 0 8px color-mix(in srgb,#22c55e 35%,transparent)}
  #clear{font-size:11px;padding:5px 10px;border-radius:10px;color:var(--muted);border-color:var(--line);background:transparent;transition:color .2s,border-color .2s}
  #clear:hover{color:var(--ink);border-color:var(--line2)}

  /* Filters */
  #filters{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:none;-ms-overflow-style:none;mask-image:linear-gradient(90deg,transparent,black 8px,black calc(100% - 8px),transparent);-webkit-mask-image:linear-gradient(90deg,transparent,black 8px,black calc(100% - 8px),transparent)}
  #filters::-webkit-scrollbar{display:none}
  #filters button{white-space:nowrap;transition:background .15s,border-color .15s,color .15s;font-size:11px;padding:5px 11px;border-radius:999px}
  #filters button.active{background:linear-gradient(180deg,#1f3a5f,#1a2f4f);border-color:#3b82f6;color:#dbeafe;box-shadow:0 0 12px color-mix(in srgb,#3b82f6 20%,transparent)}

  /* Feed */
  #feed-wrap{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;padding:10px 16px 16px;scroll-behavior:smooth}
  #feed{display:flex;flex-direction:column;gap:10px}
  .msg{position:relative;padding:13px 14px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.025),transparent);border-radius:16px;animation:msgIn .3s ease both;overflow:hidden}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
  .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:11px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .who{font-weight:600;font-size:13px}
  .to{color:var(--muted);font-size:10px;background:#171a21;border:1px solid var(--line);padding:2px 7px;border-radius:999px}
  .when{color:var(--dim);font-size:10px;margin-left:auto}
  .badge{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);text-transform:capitalize;font-weight:500}
  .badge.assign{color:#fbbf24;background:#f59e0b0d;border-color:#f59e0b33}
  .badge.inference{color:#c4b5fd;background:#a78bfa0d;border-color:#a78bfa33}
  .badge.chat{color:#93c5fd;background:#3b82f60d;border-color:#3b82f633}
  .badge.done{color:#34d399;background:#10b9810d;border-color:#10b98144}
  .badge.yield{color:#f87171;background:#ef44440d;border-color:#ef444444}
  .body{margin:0;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
  .empty{color:var(--muted);font-size:13px;padding:24px 8px;text-align:center;opacity:.8}

  /* Composer */
  footer{flex:none;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(14px);padding-bottom:env(safe-area-inset-bottom)}
  .composer{padding:10px 16px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select,textarea{background:#0e1116;border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:12px;font:inherit;font-size:13px;appearance:auto;-webkit-appearance:auto}
  select{padding-right:28px;min-width:0}
  textarea{flex:1 1 0;min-height:44px;max-height:120px;resize:none;border-radius:12px;font-size:14px;line-height:1.4}
  .send-btn{background:linear-gradient(180deg,#1f3a5f,#1a2f4f);border:1px solid #3b82f6;color:#dbeafe;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;white-space:nowrap;transition:transform .1s,opacity .2s}
  .send-btn:active{transform:scale(.95);opacity:.75}
  .send-btn:disabled{opacity:.35;border-color:var(--line);color:var(--muted);background:var(--panel)}
  .hint{color:var(--dim);font-size:10px;padding:4px 16px 10px;letter-spacing:.2px}

  /* Desktop sidebar */
  #sidebar{display:none}
  @media (min-width:860px){
    #app{flex-direction:row}
    #sidebar{display:flex;width:260px;min-width:260px;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px 12px;gap:4px}
    #sidebar-title{font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:4px 8px;margin-bottom:4px}
    #sidebar-online,#sidebar-offline{display:flex;flex-direction:column;gap:2px}
    #sidebar-empty{color:var(--dark);font-size:12px;padding:12px;text-align:center}
    .agent-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;border:1px solid transparent;cursor:pointer;background:transparent;color:var(--ink);width:100%;text-align:left;transition:background .12s,border-color .12s}
    .agent-row:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);border-color:var(--line)}
    .agent-row .av{width:24px;height:24px;font-size:10px}
    .agent-row .name{font-weight:600;font-size:13px}
    .agent-row .role{font-size:10px;color:var(--muted)}
  }

  /* Scrollbars */
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  /* Focus */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="login-wrap">
  <div id="login-card">
    <div class="login-title">Channel PIN</div>
    <input id="pin" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="20" placeholder="Enter channel PIN" />
    <button id="connect-btn" class="primary">Connect</button>
    <div id="login-msg"></div>
  </div>
</div>
<div id="app" style="display:none">
<header>
  <div id="title-row">
    <div>
      <div id="title">Hermes Coordination Channel</div>
      <div style="color:var(--muted);font-size:11px;margin-top:1px">Local assignment / chat plane · trusted certificate required on LAN</div>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <div id="status" title="Connection"></div>
      <button id="clear" title="Archive all">Clear</button>
    </div>
  </div>
  <div id="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="mine">Mine</button>
    <button data-filter="chat">Chat</button>
    <button data-filter="assign">Assign</button>
    <button data-filter="status">Status</button>
    <button data-filter="done">Done</button>
    <button data-filter="yield">Yield</button>
    <button data-filter="inference">Inference</button>
    <button data-filter="archived">Archived</button>
  </div>
</header>
<div id="feed-wrap">
  <div id="feed"></div>
  <div id="feed-empty" class="empty" style="display:none">No messages yet.<br/>Say hello or assign a task.</div>
</div>
<footer>
  <form class="composer" id="composer" autocomplete="off">
    <div class="row">
      <select id="f" aria-label="from" title="Sender" style="flex:1 1 0;min-width:0"></select>
      <select id="t" aria-label="to" title="Recipient" style="flex:1 1 0;min-width:0"><option value="all">@all</option></select>
    </div>
    <div class="row">
      <select id="ty" aria-label="type" title="Message type" style="flex:0 0 auto">
        <option value="chat">chat</option>
        <option value="assign">assign</option>
        <option value="status">status</option>
        <option value="done">done</option>
        <option value="yield">yield</option>
        <option value="inference">inference</option>
      </select>
      <textarea id="b" placeholder="Say something..." rows="1" style="flex:1 1 0;min-width:0"></textarea>
      <button class="send-btn" type="submit" id="send">Send</button>
      <div id="send-error" style="color:#f87171;font-size:12px;display:none">Failed to send</div>
    </div>
  </form>
  <div class="hint">Tip: POST JSON to <code>/api/messages</code> with header <code>X-Channel-PIN</code>.</div>
</footer>
<div id="sidebar"></div>
</div>
<script>
const API = (p)=>'/api' + p;
const colors = JSON.parse(localStorage.getItem('hc_colors') || '{"Hermes":"#2563eb","GPT":"#10b981","Codex":"#f59e0b","Ollama":"#a78bfa"}');
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function relTime(s){
  if(!s) return '--';
  const ms = Date.now() - new Date(s).getTime();
  const s60 = Math.floor(ms/1000);
  if(s60 < 5) return 'just now';
  if(s60 < 60) return s60 + 's';
  const m = Math.floor(s60/60);
  if(m < 60) return m + 'm';
  const h = Math.floor(m/60);
  if(h < 24) return h + 'h';
  return Math.floor(h/24) + 'd';
}
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text) e.textContent=text; return e; }
function pill(msg){
  const k = (msg.status||'').toLowerCase() || (msg.type||'chat').toLowerCase();
  const r = el('span','badge'); r.classList.add(esc(k)); r.textContent = k; return r;
}
const cardColors = {assign:'#f59e0b0d','inference':'#a78bfa0d',chat:'#3b82f60d',done:'#10b9810d',yield:'#ef44440d'};
const borderColors = {assign:'#f59e0b33','inference':'#a78bfa33',chat:'#3b82f633',done:'#10b98144',yield:'#ef444444'};
function renderMessage(m){
  const row = el('article','msg'); row._message = m;
  const hue = colors[m.from] || '#6b7280';
  const key = ((m.status||'').toLowerCase()||(m.type||'chat').toLowerCase());
  row.style.background = `linear-gradient(180deg, ${cardColors[key]||'rgba(255,255,255,.025)'}, transparent)`;
  row.style.borderColor = borderColors[key] || 'var(--line)';
  const av = el('span','av'); av.style.background = hue; av.textContent = (m.from||'?')[0].toUpperCase();
  const who = el('span','who'); who.textContent = m.from;
  const to = el('span','to'); to.textContent = 'to: ' + (m.to||'@all');
  const when = el('span','when'); when.textContent = relTime(m.ts); when.title = m.ts;
  const head = el('div','msg-head'); head.appendChild(av); head.appendChild(who); head.appendChild(to); head.appendChild(when); head.appendChild(pill(m));
  row.appendChild(head);
  const txt = el('p','body'); txt.textContent = m.content; row.appendChild(txt);
  return row;
}
let selectedFilter = 'all';
function applyFilter(){
  const feed = document.getElementById('feed');
  if(!feed) return;
  const mine = document.getElementById('f')?.value || '';
  const archived = selectedFilter === 'archived';
  let visibleCount = 0;
  Array.from(feed.children).forEach(node=>{
    const m = node._message; if(!m) return;
    const k = ((m.status||'').toLowerCase()||(m.type||'chat').toLowerCase());
    const isArchived = k === 'archived';
    const matchType = selectedFilter === 'all' || ['chat','assign','status','done','yield','inference'].includes(selectedFilter) && k === selectedFilter || selectedFilter === 'mine' && m.from === mine;
    const show = archived ? isArchived : matchType && !isArchived;
    node.style.display = show ? '' : 'none';
    if(show) visibleCount++;
  });
  const emptyEl = document.getElementById('feed-empty');
  if(emptyEl) emptyEl.style.display = visibleCount ? 'none' : '';
}
function renderSidebar(agents, messages){
  const wrap = document.getElementById('sidebar');
  if(!wrap) return;
  agents = Array.isArray(agents) ? agents : [];
  messages = Array.isArray(messages) ? messages : [];
  wrap.innerHTML = '<div id="sidebar-title">Agents</div><div id="sidebar-online"></div><div id="sidebar-title" style="margin-top:6px">Idle</div><div id="sidebar-offline"></div>';
  const on = document.getElementById('sidebar-online'); const off = document.getElementById('sidebar-offline');
  on.innerHTML = ''; off.innerHTML = '';
  if(!agents.length){ wrap.innerHTML += '<div id="sidebar-empty" class="empty">No agents yet.</div>'; return; }
  const PRESENCE = 60000; const now = Date.now();
  const last = new Map(); messages.slice().reverse().forEach(m=>{ if(!last.has(m.from)) last.set(m.from, m.ts); });
  const online=[]; const offline=[];
  agents.forEach(a=>{
    const ts = last.get(a.name); const t = ts ? new Date(ts).getTime() : 0;
    const on2 = t > 0 && (now-t) < PRESENCE;
    (on2 ? online : offline).push({...a, _on: on2});
  });
  function addRow(a, target){
    const r = document.createElement('button'); r.className = 'agent-row';
    if(!colors[a.name]) colors[a.name] = a.color;
    const av = el('span','av'); av.style.background = colors[a.name]; av.textContent = (a.name||'?')[0].toUpperCase();
    const info = el('span','info'); const n=el('span','name'); n.textContent=a.name; const role=el('span','role'); role.textContent=a.role||''; info.appendChild(n); info.appendChild(role);
    r.appendChild(av); r.appendChild(info);
    r.addEventListener('click', ()=>{ const t=document.getElementById('t'); if(t){ t.value=a.name; load(); }});
    target.appendChild(r);
  }
  online.forEach(a=>addRow(a, on)); offline.forEach(a=>addRow(a, off));
}
async function load(){
  setStatus(false);
  let pin = '';
  try { const el = document.getElementById('pin'); if(el) pin = (el.value||'').trim(); } catch {}
  if(!pin){
    try { pin = localStorage.getItem('hc_pin') || ''; } catch {}
  }
  const h = {'Content-Type':'application/json','X-Channel-PIN': pin};
  let agents=null; let messages=null;
  let ok = false;
  try {
    [agents, messages] = await Promise.all([
      fetch(API('/agents'), {headers:h, cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error('agents:'+r.status); return r.json(); }).catch(()=>null),
      fetch(API('/messages'), {headers:h, cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error('messages:'+r.status); return r.json(); }).catch(()=>null)
    ]);
    ok = Array.isArray(agents) && Array.isArray(messages);
  } catch (e) {
    // handled below
  }
  agents = Array.isArray(agents) ? agents : [];
  messages = Array.isArray(messages) ? messages : [];
  if(ok) setStatus(true);
  const feed = document.getElementById('feed');
  const emptyEl = document.getElementById('feed-empty');
  const fromSel = document.getElementById('f');
  const tSel = document.getElementById('t');
  const prevFrom = fromSel?.value || '';
  const prevTo = tSel?.value || '';
  fromSel.innerHTML = '';
  agents.forEach(a=>{ const o=el('option'); o.value=a.name; o.textContent=a.name+' ('+a.role+')'; fromSel.appendChild(o); if(!colors[a.name]) colors[a.name]=a.color; });
  tSel.innerHTML = '<option value="all">@all</option>' + agents.map(a=>`<option value="${esc(a.name)}">${esc(a.name)}</option>`).join('');
  if(prevFrom) fromSel.value = prevFrom;
  if(prevTo) tSel.value = prevTo;
  try { localStorage.setItem('hc_colors', JSON.stringify(colors)); } catch {}
  renderSidebar(agents, messages);
  if(feed){
    feed.innerHTML='';
    const sorted = messages.sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
    sorted.forEach(m=> feed.appendChild(renderMessage(m)));
    emptyEl.style.display = 'none';
    const activeFilterBtn = document.querySelector('#filters button[data-filter="' + selectedFilter + '"]');
    document.querySelectorAll('#filters button').forEach(x=> x.classList.toggle('active', x === activeFilterBtn));
    applyFilter();
    if (messages.length) {
      requestAnimationFrame(()=>{ feed.lastElementChild?.scrollIntoView({behavior:'smooth',block:'end'}); });
    }
  }
}
document.getElementById('connect-btn').addEventListener('click', async ()=>{
  const pin = (document.getElementById('pin').value||'').trim();
  const msgEl = document.getElementById('login-msg');
  msgEl.textContent = 'Checking...';
  const h = {'Content-Type':'application/json','X-Channel-PIN': pin};
  try {
    const r = await fetch(API('/agents'), {headers:h, mode:'cors', cache:'no-store'});
    if(!r.ok){ msgEl.textContent = 'Server returned ' + r.status; return; }
    try { localStorage.setItem('hc_pin', pin); } catch {}
    enterApp();
  } catch (err){ msgEl.textContent = 'Network: ' + err.message; }
});
document.getElementById('composer').addEventListener('submit', async e=>{
  e.preventDefault();
  const b = document.getElementById('b');
  const errEl = document.getElementById('send-error');
  const content = b.value.trim(); if(!content) return;
  const payload = { from: document.getElementById('f').value, to: document.getElementById('t').value, type: document.getElementById('ty').value, content, status: document.getElementById('ty').value, assigned_to: '' };
  const h = {'Content-Type':'application/json','X-Channel-PIN': (document.getElementById('pin')?.value||'')};
  b.disabled = true;
  errEl.style.display = 'none';
  try {
    const r = await fetch(API('/messages'), {method:'POST', headers:h, body: JSON.stringify(payload)});
    if(!r.ok) {
      const txt = (await r.text().catch(()=>'')).slice(0,200);
      throw new Error('HTTP ' + r.status + (txt ? ': ' + txt : ''));
    }
    b.value = '';
    load();
  } catch (err){
    if(errEl){ errEl.textContent = 'Send failed: ' + err.message; errEl.style.display = ''; }
  } finally { b.disabled = false; }
});
document.getElementById('filters').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-filter]'); if(!btn) return;
  selectedFilter = btn.dataset.filter;
  document.querySelectorAll('#filters button').forEach(x=> x.classList.toggle('active', x === btn));
  applyFilter();
});
document.getElementById('clear').addEventListener('click', async ()=>{
  if(!confirm('Archive all messages?')) return;
  const h = {'Content-Type':'application/json','X-Channel-PIN': document.getElementById('pin')?.value || ''};
  const msgs = await (await fetch(API('/messages'), {headers:h})).json();
  await Promise.all(msgs.map(m=> fetch(API('/messages'), {method:'PUT', headers:h, body:JSON.stringify({...m, status:'archived'})})));
  load();
});
function enterApp(){
  document.getElementById('login-wrap').classList.add('hidden');
  const app = document.getElementById('app');
  app.style.display='flex';
  app.style.opacity='0';
  app.offsetHeight; // force synchronous reflow
  app.style.transition='opacity .35s ease';
  app.style.opacity='1';
  load();
  if(!enterApp._poll){
    enterApp._poll = true;
    setInterval(load, 4000);
  }
}
function setStatus(on){
  const s = document.getElementById('status');
  if(!s) return;
  s.classList.toggle('on', !!on);
}
(function(){
  const qs = new URLSearchParams(location.search);
  const bypass = qs.get('pin');
  const saved = (()=>{ try { return localStorage.getItem('hc_pin'); } catch { return ''; } })();
  if(bypass || saved){
    const pin = bypass || saved;
    const h = {'Content-Type':'application/json','X-Channel-PIN': pin};
    fetch(API('/agents'), {headers: h, cache:'no-store'}).then(r => { if(r.ok){ enterApp(); } else { window._bypassErr = 'bypass status=' + r.status; console.warn(window._bypassErr); } }).catch(err => { window._bypassErr = 'bypass network fail'; console.warn(window._bypassErr, err); });
  }
})();
document.getElementById('pin').addEventListener('keydown', e=>{ if(e.key==='Enter'){ document.getElementById('connect-btn').click(); } });
</script>
</body>
</html>
